name: 'Deploy AIO'
description: 'Deploy AIO for pipelines'

inputs:
  wait-for-broker:
    description: 'Wait for the MQTT broker to start before returning'
    required: false
    default: 'true'

  install-go:
    description: 'Install the Go compiler'
    required: false
    default: 'false'

  install-dotnet:
    description: 'Install the .NET compiler and runtime'
    required: false
    default: 'false'

  install-rust:
    description: 'Install the Rust compiler'
    required: false
    default: 'false'

  ssh-key:
    description: 'SSH private key (deploy key) for checking out Azure/iot-operations-sdks-action'
    required: true

runs:
  using: composite
  steps:
    - name: Create k3s cluster
      run: tools/deployment/initialize-cluster.sh -y
      shell: bash

    - name: Checkout deploy action
      uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      with:
        repository: azure/iot-operations-sdks-action
        path: action-deploy
        ssh-key: ${{ inputs.ssh-key }}

    - name: Install AIO
      uses: ./action-deploy
      with:
        install_aio: "true"
        install_akri: "false"

    - name: Configure AIO
      run: tools/deployment/configure-aio.sh
      shell: bash

    - name: Install Akri
      uses: ./action-deploy
      with:
        akri: 2603
        install_aio: "false"
        install_akri: "true"

    - name: Setup .NET
      if: inputs.install-dotnet == 'true'
      uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
      with:
        dotnet-version: 9.x

    - name: Setup GO
      if: inputs.install-go == 'true'
      uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
      with:
        go-version: 1.25

    - name: Setup Rust
      if: inputs.install-rust == 'true'
      uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659 # v1
      with:
        # Disable this action's built-in cache; callers that care about
        # caching should use `Swatinem/rust-cache` in their workflow,
        # which also caches `target/` (this action does not).
        cache: false

    - name: Wait for Mqtt Broker
      if: inputs.wait-for-broker == 'true'
      run: kubectl wait --for=create pod/aio-broker-frontend-0 --timeout=120s
      shell: bash
