name: Run Codegen
permissions:
  contents: write
on:
  workflow_dispatch:

jobs:
  codegen:
    name: CI-codegen
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup .NET 10
        uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6
        with:
          dotnet-version: 10.0.400

      - name: Setup Rust (pinned via rust-toolchain.toml)
        uses: actions-rust-lang/setup-rust-toolchain@a188e68d0fd2bd36ad51dccb2b07ba6e75105f30 # v2
        with:
          rust-src-dir: rust
          cache: false
          # Warning-denial belongs to pinned-toolchain Clippy in CI-Rust.
          rustflags: ''
          build-warnings: ''

      - name: Build and run WoT codegen
        run: | 
          dotnet build -c Debug wot-codegen/codegen.sln
          ./wot-codegen/gen_all.sh

      - name: Format Rust code
        working-directory: rust
        run: cargo fmt --all

      - name: Verify Generated Code Matches Repo
        run: |
          if git diff --exit-code --ignore-cr-at-eol
          then
              echo "Running codegen changed no files. No changes will be committed to this branch."
              exit 0
          fi

          echo "Codegen changed 1 or more files. Will commit these changes to the branch"
              
          # configure user account to match the runner of this workflow
          git config --global user.name "${{ github.actor }}"
          git config --global user.email "${{ github.actor }}@users.noreply.github.com"
      
          git add -A
          git commit -m 'Ran Codegen'
          git push
            
