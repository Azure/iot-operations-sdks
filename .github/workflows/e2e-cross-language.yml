name: CI-Cross language
on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "0 11 * * *" # Nightly at 4am PST

# Cancel old runs
concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  actions: read
  checks: write

env:
  AIO_BROKER_HOSTNAME: localhost
  AIO_BROKER_TCP_PORT: 1883
  AIO_MQTT_USE_TLS: false

jobs:
  cross-language:
    name: CI-cross-language
    runs-on: ubuntu-latest
    timeout-minutes: 20

    strategy:
      fail-fast: false
      matrix:
        server: [dotnet-server, rust-server]

    env:
      COUNTER_SERVER_ID: ${{ matrix.server }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      #=======================================================================
      # Install prerequisites
      #=======================================================================
      - name: Install AIO
        uses: ./.github/actions/configure-aio
        with:
          wait-for-broker: 'true'
          install-dotnet: 'true'
          install-rust: 'true'
          ssh-key: ${{ secrets.ACTIONS_REPO_SSH_KEY }}

      #=======================================================================
      # Build WoT codegen and verify it matches repository
      #=======================================================================
      - name: Setup .NET 10
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6
        with:
          dotnet-version: 10.0.x

      - name: Build WoT codegen
        run: dotnet build -c Debug wot-codegen/codegen.sln

      - name: CodeGen Rust Counter samples
        run: |
          pushd rust/sample_applications/counter; bash gen.sh; popd

      - name: CodeGen .NET Counter samples
        run: |
          pushd dotnet/samples/Protocol/TestThing; bash gen.sh; popd

      - name: Verify Generated Code Matches Repo
        run: |
          if ! git diff --exit-code --ignore-cr-at-eol
          then
              echo "codegen'd envoy updates not checked in"
              git diff-files
              echo "If this gets triggered by the differences between windows and linux line endings, we may need to modify this check"
              exit 1
          fi

      #=======================================================================
      # Build all the components
      #=======================================================================
      - name: Build .NET sample
        run: |
          cd dotnet
          dotnet build -c Release

      - name: Build Rust sample
        run: |
          cd rust
          cargo build --release --config profile.release.panic=\'abort\' \
            -p counter_client \
            -p counter_server

      #=======================================================================
      # Run a server
      #=======================================================================
      - name: Run .NET server
        if: matrix.server == 'dotnet-server'
        run: dotnet run -c Release --project dotnet/samples/Protocol/RPC/CounterServer &
        env:
          AIO_MQTT_CLIENT_ID: ${{ matrix.server }}

      - name: Run Rust server
        if: matrix.server == 'rust-server'
        run: rust/target/release/counter_server &
        env:
          AIO_MQTT_CLIENT_ID: ${{ matrix.server }}

      #=======================================================================
      # Run all the clients
      #=======================================================================
      - name: Run .NET client
        run: dotnet run -c Release --project dotnet/samples/Protocol/RPC/CounterClient
        if: always()
        env:
          AIO_MQTT_CLIENT_ID: dotnet-client

      - name: Run Rust client
        run: rust/target/release/counter_client
        if: always()
        env:
          AIO_MQTT_CLIENT_ID: rust-client
