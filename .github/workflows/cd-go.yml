name: CD-go

on:
  push:
    branches:
      - main
    paths:
      - 'go/go.work'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    name: CD-go

    steps:
    - name: Checkout code
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      with:
        fetch-depth: 0
        fetch-tags: true

    - name: Release Go SDKs
      run: go/tools/release.sh
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
