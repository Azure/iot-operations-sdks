name: CI-xregistry-cli

on:
  workflow_dispatch:
  pull_request:
    paths:
      - '.github/workflows/ci-xregistry-cli.yml'
      - '.github/workflows/_rust-tool-check.yml'
      - 'tools/xregistry-cli/**'
      - 'rust/azure_iot_operations_mqtt/**'
      - 'rust/azure_iot_operations_protocol/**'
      - 'rust/azure_iot_operations_services/**'
      - 'rust/scripts/**'
  push:
    branches:
      - main
  schedule:
    - cron: '0 11 * * *'  # Nightly (04:00 PT)

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    uses: ./.github/workflows/_rust-tool-check.yml
    with:
      name: xregistry-cli
      path: tools/xregistry-cli
      aio-sdks-registry: false
