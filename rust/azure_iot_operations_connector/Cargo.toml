[package]
name = "azure_iot_operations_connector"
version = "2.1.1"
edition = "2024"
rust-version.workspace = true
license = "MIT"
description = "Azure IoT Operations Connector"
repository = "https://github.com/Azure/iot-operations-sdks"
readme = "README.md"
publish = true

[dependencies]
azure_iot_operations_protocol = { version = "1.0", path = "../azure_iot_operations_protocol" }
azure_iot_operations_services = { version = "1.4.0-beta2", path = "../azure_iot_operations_services", features = ["state_store", "edge_registry", "schema_registry", "azure_device_registry"]  }
azure_iot_operations_mqtt = { version = "1.1", path = "../azure_iot_operations_mqtt" }
chrono = { workspace = true, features = ["clock"] }
derive_builder.workspace = true
derive-getters.workspace = true
log.workspace = true
notify.workspace = true
notify-debouncer-full.workspace = true
schemars = "0.8"
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true
thiserror.workspace = true
tokio = { workspace = true, features = ["rt", "rt-multi-thread", "macros", "sync", "time"] }
tokio-retry2 = { version = "0.5.7", features = ["jitter"] }
tokio-util.workspace = true

[dev-dependencies]
bytes.workspace = true
env_logger.workspace = true
temp-env = { workspace = true, features = ["async_closure"] }
tempfile.workspace = true
test-case.workspace = true
tokio-test.workspace = true

[lints]
workspace = true
