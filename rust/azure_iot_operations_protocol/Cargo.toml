[package]
name = "azure_iot_operations_protocol"
version = "1.1.0"
edition = "2024"
rust-version.workspace = true
license = "MIT"
description = "Utilities for using the Azure IoT Operations Protocol over MQTT"
repository = "https://github.com/Azure/iot-operations-sdks"
readme = "README.md"
publish = true

[features]
default = []
all = ["internal-utils"]
internal-utils = []

[dependencies]
azure_iot_operations_mqtt = { version = "1.1", path = "../azure_iot_operations_mqtt" }
bytes.workspace = true
derive_builder.workspace = true
iso8601-duration.workspace = true
log.workspace = true
parking_lot.workspace = true
tokio = { workspace = true, features = ["rt", "rt-multi-thread", "time", "sync", "macros"] }
tokio-util.workspace = true
uuid = { workspace = true, features = ["v4", "fast-rng"] }
chrono = { workspace = true, default-features = false, features = ["std"] }
regex.workspace = true
thiserror.workspace = true

[dev-dependencies]
async-std = "1.12"
async-trait.workspace = true
azure_iot_operations_mqtt = { version = "1.1", path = "../azure_iot_operations_mqtt", features = ["test-utils"] }
ctor = "0.2"
datatest-stable = "0.2"
env_logger.workspace = true
futures.workspace = true
mockall = "0.13.1"
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true
serde_yaml = "0.9"
test-case.workspace = true
tokio-test.workspace = true
toml = "0.8"

[lints]
workspace = true

[[test]]
name = "protocol_tests"
harness = false
