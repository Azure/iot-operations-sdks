[package]
name = "azure_iot_operations_mqtt"
version = "1.2.3"
edition = "2024"
rust-version.workspace = true
license = "MIT"
description = "MQTT version 5.0 client library providing flexibility for decoupled asynchronous applications"
repository = "https://github.com/Azure/iot-operations-sdks"
readme = "README.md"
publish = true

[features]
default = [ ]
test-utils = ["tempfile", "ms-mqtt-client/__integration"]

[dependencies]
anyhow = "1.0.86"
async-trait.workspace = true
bytes.workspace = true
chrono = { workspace = true, default-features = false, features = ["std"] }
derive_builder.workspace = true
derive-getters.workspace = true
fluent-uri = "0.3.2"
futures.workspace = true
log.workspace = true
ms-mqtt-client = { workspace = true, features = ["__allow_omitted_auth_method"] }
notify.workspace = true
notify-debouncer-full.workspace = true
openssl = "0.10"
parking_lot.workspace = true
rand = "0.8.5"
regex.workspace = true
tempfile = { workspace = true, optional = true }
thiserror.workspace = true
tokio = { workspace = true, features = ["io-util", "macros", "net", "rt", "sync", "time"] }
uuid = { workspace = true, features = ["v4", "fast-rng"] }

# for kTLS support
hkdf = { version = "0.12", default-features = false }
hmac = { version = "0.12", default-features = false, features = [
    "reset", # for `hmac::Hmac::finalize_reset`
] }
libc = { version = "0.2.151", default-features = false }
nix = { version = "0.30", default-features = false, features = ["net", "process", "socket", "zerocopy"] }
sha2.workspace = true

[dev-dependencies]
azure_iot_operations_mqtt = { path = ".", features = ["test-utils"] }
env_logger.workspace = true
temp-env.workspace = true
test-case.workspace = true
tokio-test.workspace = true
tokio = { workspace = true, features = [
    "macros",
    "rt",
    "rt-multi-thread",
    "test-util",
] }

[lints]
workspace = true
