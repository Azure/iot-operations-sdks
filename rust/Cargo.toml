[workspace]
members = [
  # --- SDK crates ---
  "azure_iot_operations_connector",
  "azure_iot_operations_mqtt",
  "azure_iot_operations_protocol",
  "azure_iot_operations_services",

  # --- Sample applications ---
  "sample_applications/counter/envoy",
  "sample_applications/counter/counter_client",
  "sample_applications/counter/counter_server",
  "sample_applications/event_driven_app/input_client",
  "sample_applications/event_driven_app/output_client",
  "sample_applications/sample_connector_scaffolding",
]

# Bare `cargo build`/`test`/`clippy` at the workspace root operate only on the
# SDK crates, which is what we work on day to day. The sample applications
# remain full members (so they stay compile-guarded and are covered by
# `--workspace`/`--all` in CI) but are opt-in for default operations.
default-members = [
  "azure_iot_operations_connector",
  "azure_iot_operations_mqtt",
  "azure_iot_operations_protocol",
  "azure_iot_operations_services",
]

resolver = "2"

[workspace.package]
# This is the MSRV. If this value is changed, it also must be changed in the CI for the SDK
# to ensure that tests are correctly run against it.
rust-version = "1.88"

[workspace.lints.rust]
rust_2018_idioms = { level = "deny", priority = -1 }

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
too_many_lines = "allow"
module_name_repetitions = "allow"
large_futures = "allow"     # Currently, the underlying client creates large futures. Remove when fixed.

[workspace.dependencies]
bytes = "1.5.0"
chrono = "0.4"
derive_builder = "0.20"
derive-getters = { version = "0.5.0", features = ["auto_copy_getters"] }
log = "0.4.21"                                                          # For performance, I believe this should have some filters on it
parking_lot = "0.12"
thiserror = "2.0.12"
tokio = { version = "1.41", features = ["rt", "rt-multi-thread", "time", "sync", "macros"] } # TODO: Probably should set this on a per-crate basis to keep size down, as not all features are needed everywhere
tokio-util = "0.7.11"
# dev dependencies
env_logger = "0.11.3"
test-case = "3.3.1"
tokio-test = "0.4.4"
notify = "7"
notify-debouncer-full = "0.4.0"
tempfile = "3.19.1"
temp-env = "0.3.6"
